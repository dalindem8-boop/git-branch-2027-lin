<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 30px;
        }

        .signup-box {
            width: 420px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #2d3748;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;

            border: 2px solid #e2e8f0;
            border-radius: 10px;

            font-size: 15px;
            margin-bottom: 18px;

            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 8px;

            margin: 5px 0 22px;

            font-size: 14px;
            color: #718096;
        }

        .terms input {
            width: auto;
            margin: 0;
        }

        .terms a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .signin {
            text-align: center;
            margin-top: 25px;

            color: #718096;
            font-size: 14px;
        }

        .signin a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .signin a:hover {
            color: #764ba2;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <h1>Create Account</h1>

        <p class="subtitle">
            Sign up to get started
        </p>

        <form>

            <label>Full Name</label>
            <input
                type="text"
                placeholder="Enter your full name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                placeholder="Create a password"
                required
            >

            <label>Confirm Password</label>
            <input
                type="password"
                placeholder="Confirm your password"
                required
            >

            <div class="terms">
                <input type="checkbox" required>

                <span>
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                </span>
            </div>

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p class="signin">
            Already have an account?
            <a href="index.html">Sign In</a>
        </p>

    </div>
<a href="page.html">Home</a>
<a href="index.html">Sign In</a>
</body>
</html>
