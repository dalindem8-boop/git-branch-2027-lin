<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .login-box {
            width: 400px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
        }

        form label {
            display: block;
            color: #2d3748;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px;

            border: 2px solid #e2e8f0;
            border-radius: 10px;

            font-size: 15px;
            margin-bottom: 20px;

            transition: 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remember label {
            margin: 0;
            font-weight: normal;
            color: #555;
        }

        .options a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .options a:hover {
            color: #764ba2;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .signup {
            text-align: center;
            margin-top: 25px;

            color: #718096;
            font-size: 14px;
        }

        .signup a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .signup a:hover {
            color: #764ba2;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to your account
        </p>

        <form>

            <label>Email</label>
            <input
                type="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                placeholder="Enter your password"
                required
            >

            <div class="options">

                <div class="remember">
                    <input type="checkbox">
                    <label>Remember me</label>
                </div>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit">
                Sign In
            </button>

        </form>

        <p class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </p>

    </div>

</body>
</html>
